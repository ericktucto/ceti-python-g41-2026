[project]
name = "tienda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erick Tucto", email = "erick@ericktucto.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "sqlmodel>=0.0.42",
]

[project.scripts]
hashing = "tienda.hashing:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "tienda:app"
